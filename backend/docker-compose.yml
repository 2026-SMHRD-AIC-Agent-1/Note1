services:
  backend:
    build: .
    container_name: ai-interview-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app          # 코드 수정이 바로 반영되도록 로컬 폴더를 컨테이너에 연결
      - /app/.venv       # 로컬 가상환경은 컨테이너 안으로 덮어쓰지 않도록 제외
    env_file:
      - .env             # .env.example을 복사해서 .env로 만든 뒤 사용
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
